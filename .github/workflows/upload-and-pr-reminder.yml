name: Upload Assets & Create PR Reminder

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for asset upload'
        required: false
        default: 'feat(planetsref): upload PBR batch map assets'

permissions:
  contents: write
  pull-requests: write

jobs:
  upload-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: shorting-hat
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure Target Directory Exists
        run: |
          mkdir -p public/planetsref

      - name: Commit and Push Changes
        run: |
          git add public/planetsref/
          if git diff --staged --quiet; then
            echo "No new files or changes detected in public/planetsref/."
          else
            git commit -m "${{ github.event.inputs.commit_message }}"
            git push origin shorting-hat
          fi

      - name: Check or Create Pull Request to Alpha
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'shorting-hat';
            const base = 'alpha';

            // Check if PR already exists
            const existingPRs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open'
            });

            if (existingPRs.data.length > 0) {
              const prNumber = existingPRs.data[0].number;
              console.log(`Open PR #${prNumber} already exists.`);
              
              // Post reminder comment on existing PR
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: '🚨 **Batch Upload Update / Reminder**: New commits pushed to `shorting-hat` under `public/planetsref/`. Auto-merge is DISABLED. Requires explicit Admin review and manual approval before merging to `alpha`.'
              });
            } else {
              // Create new Pull Request
              const newPR = await github.rest.pulls.create({
                owner,
                repo,
                title: 'Batch Upload: PBR Maps to public/planetsref/',
                head,
                base,
                body: '🚨 **Batch Upload Pending Review**: Assets updated in `public/planetsref/` on `shorting-hat`.\n\n- Auto-merge: DISABLED\n- Target branch: `alpha`\n- Note: Admin review and manual approval required.'
              });
              
              console.log(`Created new PR #${newPR.data.number}`);
            }
